name: Bosnia Three List

on:
  workflow_dispatch:

  schedule:
    # Runs every hour.
    - cron: "0 * * * *"

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout bosnia3
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate bosnia_three_list.txt
        run: |
          python generate_bosnia_three_list.py

      - name: Commit changed output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add bosnia_three_list.txt

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Update bosnia_three_list"
            git push
          fi
